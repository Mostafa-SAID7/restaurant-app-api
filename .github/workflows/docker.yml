name: 🐳 Docker Build Verification

on:
  push:
    branches: [ main, master ]
    paths:
      - 'api/Dockerfile'
      - 'api/**/*.cs'
      - 'api/*.csproj'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'api/Dockerfile'
      - 'api/**/*.cs'
      - 'api/*.csproj'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -f api/Dockerfile \
            -t restaurant-api:${{ github.sha }} \
            -t restaurant-api:latest \
            .

      - name: 📋 Inspect Docker image
        run: |
          docker images restaurant-api
          docker inspect restaurant-api:${{ github.sha }} | jq '.[0] | {Id, Created, Size, Architecture, Os}'

      - name: 🏥 Verify container starts
        run: |
          docker run --rm -d \
            --name health-check \
            -e ASPNETCORE_ENVIRONMENT=Development \
            restaurant-api:${{ github.sha }} \
            dotnet RestaurantAPI.dll &
          
          sleep 3
          
          if docker ps | grep -q health-check; then
            echo "✅ Container started successfully"
            docker stop health-check || true
          else
            echo "❌ Container failed to start"
            docker logs health-check || true
            exit 1
          fi

      - name: ✅ Docker build verification complete
        run: echo "Docker image built and verified successfully"
