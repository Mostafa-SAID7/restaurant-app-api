name: 📦 Publish Docker Image to GHCR

# Publishes Docker image to GitHub Container Registry (ghcr.io)
# Triggers on:
# - Push of version tags (v1.0.0, v1.0.1, etc.)
# - Manual workflow_dispatch with tag input

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0.0). If not exists, will be created on current commit.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and Publish Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 📋 Determine and validate image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG=${{ github.ref_name }}
            LATEST_TAG="latest"
          else
            TAG=${{ github.event.inputs.tag }}
            LATEST_TAG=""
          fi
          
          # Validate tag format
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ ERROR: Tag must match format vX.Y.Z (e.g., v1.0.0)"
            exit 1
          fi
          
          # For manual dispatch, verify tag exists
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "❌ ERROR: Tag '$TAG' does not exist as a git tag."
              echo ""
              echo "To create and push the tag:"
              echo "  git tag $TAG"
              echo "  git push origin $TAG"
              echo ""
              echo "Then run this workflow again."
              exit 1
            fi
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "🏷️ Image tag: ${TAG}"

      - name: 🔐 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

      - name: ✅ Image published successfully
        run: |
          echo "📦 Published to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          echo "🔗 View at: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
