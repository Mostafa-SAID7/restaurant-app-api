name: Publish Docker Image to GHCR

# Publishes Docker image to GitHub Container Registry (ghcr.io)
# Triggers on:
# - Push of version tags (v1.0.0, v1.0.1, etc.)
# - Manual workflow_dispatch with tag input

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0.0). Will create tag if it does not exist.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and Publish Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set lowercase image name
        run: |
          # GHCR requires repository name to be lowercase
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Determine and validate image tag
        id: meta
        run: |
          set -euo pipefail
          
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          
          # Trim whitespace
          TAG=$(echo "$TAG" | xargs)
          
          # Validate format vX.Y.Z
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must match vX.Y.Z (e.g. v1.0.0). Got: '$TAG'"
            exit 1
          fi
          
          # Make sure we can see remote tags
          git fetch --tags --force origin 2>/dev/null || true
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "Tag $TAG does not exist - creating it on current commit ${{ github.sha }}"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "${{ github.sha }}" -m "Release $TAG"
              git push origin "$TAG"
              echo "Created and pushed tag $TAG"
            else
              echo "ERROR: Tag $TAG does not exist"
              exit 1
            fi
          fi
          
          # Build tags with lowercase image name (GHCR requirement)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
          fi
          
          echo "Using tag: $TAG"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image published successfully
        run: |
          echo "Published to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          echo "View at: https://github.com/${{ github.repository }}/pkgs/container/restaurant-app-api"
