name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore api/RestaurantAPI.csproj

      - name: Build (Release)
        run: dotnet build api/RestaurantAPI.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test api/RestaurantAPI.csproj --no-build -c Release --verbosity normal || true

      - name: Publish application
        run: dotnet publish api/RestaurantAPI.csproj --no-build -c Release -o ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish
          retention-days: 7

      - name: Verify Docker build
        run: |
          docker build -f api/Dockerfile -t restaurant-api:test .

      - name: Quick container health check
        run: |
          docker run --rm -d --name test-api -p 8080:8080 restaurant-api:test || true
          sleep 2
          docker logs test-api || true
          docker stop test-api || true
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Format check
        run: dotnet format api/RestaurantAPI.csproj --verify-no-changes || echo "Format issues detected (informational)"
        continue-on-error: true
