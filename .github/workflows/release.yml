name: 📦 Create Release

# How to create a real release:
# 1. Merge PRs to main (Release Drafter updates the draft)
# 2. Create and push a tag: git tag v1.0.0 && git push origin v1.0.0
# 3. This workflow will automatically create the GitHub Release and publish Docker image to GHCR

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📋 Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG=${{ github.ref_name }}
          else
            TAG=${{ github.event.inputs.tag }}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📍 Release tag: ${TAG}"

      - name: 📝 Get Release Notes
        id: notes
        run: |
          # Get git log since previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.tag.outputs.tag }}^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --oneline --pretty=format:"- %s" | head -50)
          else
            # Get commits since previous tag
            CHANGELOG=$(git log $PREV_TAG..${{ steps.tag.outputs.tag }} --oneline --pretty=format:"- %s")
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📦 Create Release (modern action)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Release ${{ steps.tag.outputs.tag }}

            ### Changes
            ${{ steps.notes.outputs.changelog }}

            ---
            📦 **Docker Image:** `ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}`

            See the full **[Changelog](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md)** for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Release created successfully
        run: echo "📦 Release ${{ steps.tag.outputs.tag }} published"
